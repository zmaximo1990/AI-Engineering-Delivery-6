[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery6"
version = "0.1.0"
description = "Hierarchical multi-agent research and analysis orchestrator"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Dependency pins stay in requirements.txt.
# This distribution carries no modules; `pip install .` only checks requires-python.
[tool.setuptools]
packages = []
